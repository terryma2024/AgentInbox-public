name: AgentInbox
options:
  bundleIdPrefix: dev.matianyi
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    AGENTINBOX_APP_GROUP: group.dev.matianyi.agentinbox
    AGENTINBOX_KEYCHAIN_GROUP: $(AppIdentifierPrefix)dev.matianyi.agentinbox.shared
    AGENTINBOX_APP_SIGN_STYLE: Automatic
    AGENTINBOX_APP_PROFILE: ''
    AGENTINBOX_WIDGET_PROFILE: ''
    AGENTINBOX_TEST_PROFILE: ''
    AGENTINBOX_APNS_ENVIRONMENT: sandbox
    AGENTINBOX_APNS_ENTITLEMENT: development
    TARGETED_DEVICE_FAMILY: '1,2'
  configs:
    Release:
      AGENTINBOX_APNS_ENVIRONMENT: production
      AGENTINBOX_APNS_ENTITLEMENT: production
targets:
  AgentInbox:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        PRODUCT_BUNDLE_IDENTIFIER: dev.matianyi.agentinbox
        CODE_SIGN_STYLE: $(AGENTINBOX_APP_SIGN_STYLE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(AGENTINBOX_APP_PROFILE)
        INFOPLIST_KEY_CFBundleDisplayName: Agent 收件箱
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agent 收件箱
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            '100.64.0.0/10':
              NSExceptionAllowsInsecureHTTPLoads: true
            'fd7a:115c:a1e0::/48':
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: AgentInbox
            CFBundleURLSchemes: [agentinbox]
        AgentInboxPrivateKeychainGroup: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        AgentInboxAppGroup: $(AGENTINBOX_APP_GROUP)
        AgentInboxKeychainGroup: $(AGENTINBOX_KEYCHAIN_GROUP)
        AgentInboxAPNsEnvironment: $(AGENTINBOX_APNS_ENVIRONMENT)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/AgentInbox.entitlements
      properties:
        aps-environment: $(AGENTINBOX_APNS_ENTITLEMENT)
        com.apple.security.application-groups: [$(AGENTINBOX_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER), $(AGENTINBOX_KEYCHAIN_GROUP)]
    dependencies:
      - target: AgentInboxWidget
  AgentInboxWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.matianyi.agentinbox.widget
        CODE_SIGN_STYLE: $(AGENTINBOX_APP_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: $(AGENTINBOX_WIDGET_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Agent 待决
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            '100.64.0.0/10':
              NSExceptionAllowsInsecureHTTPLoads: true
            'fd7a:115c:a1e0::/48':
              NSExceptionAllowsInsecureHTTPLoads: true
        AgentInboxAppGroup: $(AGENTINBOX_APP_GROUP)
        AgentInboxKeychainGroup: $(AGENTINBOX_KEYCHAIN_GROUP)
        AgentInboxAPNsEnvironment: $(AGENTINBOX_APNS_ENVIRONMENT)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/AgentInboxWidget.entitlements
      properties:
        aps-environment: $(AGENTINBOX_APNS_ENTITLEMENT)
        com.apple.security.application-groups: [$(AGENTINBOX_APP_GROUP)]
        keychain-access-groups: [$(AGENTINBOX_KEYCHAIN_GROUP)]
  AgentInboxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        GENERATE_INFOPLIST_FILE: YES
        PROVISIONING_PROFILE_SPECIFIER: $(AGENTINBOX_TEST_PROFILE)
    dependencies:
      - target: AgentInbox
  AgentInboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        GENERATE_INFOPLIST_FILE: YES
        PROVISIONING_PROFILE_SPECIFIER: $(AGENTINBOX_TEST_PROFILE)
    dependencies:
      - target: AgentInbox
schemes:
  AgentInbox:
    build:
      targets:
        AgentInbox: all
    test:
      targets: [AgentInboxTests, AgentInboxUITests]
